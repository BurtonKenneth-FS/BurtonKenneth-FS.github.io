<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Request a quote from Ken's Electronics.">
  <title>Get a Quote | Ken's Electronics</title>
  <link rel="stylesheet" href="styles.css?v=45">
  <script src="script.js?v=7" defer></script>
</head>
<body>
  <nav class="top-menu" aria-label="Main navigation">
    <a class="nav-brand" href="main.html" aria-label="Ken's Electronics home">
      <img src="images/black-logo-transparent.png" alt="">
    </a>
    <div class="nav-links" id="primary-navigation">
      <a class="menu-item" href="main.html">Home</a>
      <a class="menu-item" href="about.html">About Us</a>
      <a class="menu-item menu-item-cta" href="quote.html" aria-current="page">Get a Quote</a>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch color theme" aria-pressed="false" title="Switch color theme">
      <svg class="theme-icon" data-theme-icon="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>
      <svg class="theme-icon" data-theme-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
    </button>
    <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="primary-navigation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </nav>

  <main class="welcome-card" id="quote">
    <h1>Get a Quote</h1>
    <p class="intro">Share a few details about yourself and the work you have in mind.</p>
    <form class="quote-fields" id="quote-request-form">
      <div class="field-group">
        <label for="full-name">Name</label>
        <input id="full-name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
      </div>
      <div class="field-group">
        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="Your phone number" required>
      </div>
      <div class="field-group">
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="field-group">
        <label for="request-description">Describe your request</label>
        <textarea id="request-description" name="request" rows="5" placeholder="Tell us what you need help with" required></textarea>
      </div>
      <button class="welcome-button quote-submit" type="submit">Request a Quote</button>
      <p class="form-note" id="quote-form-note" aria-live="polite">Form delivery needs to be connected before requests can be sent.</p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <nav class="footer-navigation" aria-label="Footer navigation">
        <h2 class="footer-heading">Explore</h2>
        <div class="footer-links">
          <a href="main.html">Home</a>
          <a href="about.html">About Us</a>
          <a href="quote.html" aria-current="page">Get a Quote</a>
        </div>
      </nav>
      <section class="footer-contact-card" aria-labelledby="footer-brand-title">
        <h2 id="footer-brand-title">Ken's Electronics</h2>
        <p><span>Phone</span><span class="footer-placeholder">(305)-215-8797</span></p>
        <p><span>Email</span><span class="footer-placeholder">[Email address placeholder]</span></p>
      </section>
    </div>
  </footer>
</body>
</html>
